<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Duit</title>
<meta name="description" content="Catat pengeluaran harian, pantau budget per kategori dan jatah makan per hari.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catatan Duit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
/* Tata letak: satu kolom maks 560px ala aplikasi iPhone. Bilah atas menempel (Periode/Harian + pilih tanggal),
   isi di tengah, kolom ketik cepat menempel di bawah. Font sistem supaya terasa native dan jalan offline. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E7EDE9; --ink:#14201A; --muted:#5B6B63; --line:#DCE3DE; --track:#DDE5E0;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --warn:#C98A0A; --warn-ink:#8A5300; --warn-bg:#F6E9CF;
  --crit:#C8402E; --crit-ink:#A93323; --crit-bg:#F7DDD7;
  --c0:#2E8B74; --c1:#D0852B; --c2:#5B7FD1; --c3:#C4567A; --c4:#8C6BC8; --c5:#3E9BB5; --c6:#9AA64A; --c7:#8A7A6E;
  --shadow:0 1px 2px rgba(20,32,26,.05),0 10px 28px rgba(20,32,26,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#151D1A; --surface2:#1F2A26; --ink:#E5ECE8; --muted:#93A49B; --line:#27322D; --track:#27332E;
    --accent:#3DBE9C; --accent-ink:#06211A; --accent-soft:#16342C;
    --warn:#E0A93B; --warn-ink:#F0C66F; --warn-bg:#3A2E12;
    --crit:#EE7A66; --crit-ink:#F4A191; --crit-bg:#3E1E18;
    --c0:#4CC3A5; --c1:#E6A24E; --c2:#86A6EE; --c3:#E57FA0; --c4:#B196E8; --c5:#62BBD6; --c6:#BBC56A; --c7:#B3A498;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface2:#1F2A26; --ink:#E5ECE8; --muted:#93A49B; --line:#27322D; --track:#27332E;
  --accent:#3DBE9C; --accent-ink:#06211A; --accent-soft:#16342C;
  --warn:#E0A93B; --warn-ink:#F0C66F; --warn-bg:#3A2E12;
  --crit:#EE7A66; --crit-ink:#F4A191; --crit-bg:#3E1E18;
  --c0:#4CC3A5; --c1:#E6A24E; --c2:#86A6EE; --c3:#E57FA0; --c4:#B196E8; --c5:#62BBD6; --c6:#BBC56A; --c7:#B3A498;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);padding-inline:env(safe-area-inset-left) env(safe-area-inset-right);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---- bilah atas ---- */
#shell{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font:700 20px/1.2 var(--font-num);letter-spacing:-.01em}
.brand small{display:block;font:500 12px/1.3 var(--font);color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0}
.iconbtn svg{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:12px;padding:3px;background:var(--surface2);border-radius:12px}
.seg button{border:0;background:none;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:10px}
.stepper .iconbtn{flex:none;width:38px;height:38px;border-radius:50%}
.stepper .iconbtn:disabled{opacity:.35;cursor:default}
.stepper .lab{flex:1;min-width:0;position:relative;text-align:center;font-weight:650;font-variant-numeric:tabular-nums;padding:6px 4px;border-radius:10px}
.stepper .lab input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--accent)}

/* ---- isi ---- */
.app{max-width:560px;margin:0 auto;padding:6px 16px 28px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font:700 17px/1.25 var(--font-num);letter-spacing:-.01em}
.card h2 .sub{font:500 12px var(--font);color:var(--muted);margin-left:6px;letter-spacing:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.head h2{margin:0}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{display:block;margin-top:2px;font:700 40px/1.05 var(--font-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px 16px;margin-top:14px}
.stat{min-width:0}
.stat .lbl{display:block;margin-bottom:2px;font-size:11px}
.stat b{display:block;font:650 16px/1.25 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.ok b{color:var(--accent)}
.stat.crit b{color:var(--crit-ink)}
.note{margin:12px 0 0;font-size:13px;color:var(--muted)}

.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:12px}
.bar.lg{height:14px}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .45s ease}
.warn>.bar>i,.bar.warn>i{background:var(--warn)}
.crit>.bar>i,.bar.crit>i{background:var(--crit)}

/* ---- kategori ---- */
.meters{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.meter{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 8px}
.meter:active{background:var(--surface2)}
.m-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.m-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.m-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c0)}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}.c6{background:var(--c6)}.c7{background:var(--c7)}
.m-amt{flex:none;font:500 13px var(--font-num);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.m-amt b{font-weight:650;color:var(--ink)}
.meter .bar{margin-top:8px}
.m-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.m-note{margin-top:4px;font-size:12px;color:var(--muted)}
.tag{display:none;padding:1px 8px;border-radius:999px;font-weight:600;font-size:11px}
.warn .tag{display:inline-block;background:var(--warn-bg);color:var(--warn-ink)}
.crit .tag{display:inline-block;background:var(--crit-bg);color:var(--crit-ink)}
.crit .m-left{color:var(--crit-ink)}
.addcat{display:block;width:100%;margin-top:6px;padding:10px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--accent);font-weight:600}

/* ---- sorotan ---- */
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tips i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--accent)}
.tips .warn i{background:var(--warn)}.tips .crit i{background:var(--crit)}.tips .info i{background:var(--muted)}

/* ---- jatah makan ---- */
.fhist{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.frow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.frow .d{color:var(--muted);font-variant-numeric:tabular-nums}
.frow .bar{margin:0;height:8px}
.frow .t{font:500 12px var(--font-num);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.frow.crit .t{color:var(--crit-ink)}
.frow.sel .d{color:var(--ink);font-weight:700}
.minifood{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.minifood .v{font:700 22px/1.1 var(--font-num);font-variant-numeric:tabular-nums}
.minifood .r{text-align:right;font-size:13px;color:var(--muted)}
.minifood .r b{display:block;font:650 15px var(--font-num);color:var(--accent)}
.minifood.crit .r b{color:var(--crit-ink)}

/* ---- daftar catatan ---- */
.ghead{display:flex;justify-content:space-between;gap:8px;padding:14px 4px 6px;font-size:13px;font-weight:650;color:var(--muted)}
.ghead:first-child{padding-top:0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--surface2)}
.item .main{flex:1;min-width:0}
.item .t{display:block;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{display:flex;align-items:center;gap:6px;margin-top:1px;font-size:12px;color:var(--muted)}
.item .a{flex:none;font:600 15px var(--font-num);font-variant-numeric:tabular-nums}
.item .a.in{color:var(--accent)}
.empty{margin:0;padding:18px 6px;text-align:center;color:var(--muted)}

/* ---- sambutan & notice ---- */
.hello h2{font-size:20px}
.hello p{margin:0 0 10px;color:var(--muted)}
.nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px}
.nudge .sp{flex:1;min-width:160px}
.nudge button{border:0;background:none;padding:4px 6px;font-weight:700;color:inherit;text-decoration:underline}

/* ---- tombol & form ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--crit-ink);background:var(--crit-bg);border-color:transparent}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:120px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.fl{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.field textarea{resize:vertical;min-height:84px}
.field .hint{font-size:12px;color:var(--muted)}
.amount{font:700 26px var(--font-num)!important;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip[aria-pressed="true"] .dot{background:var(--accent-ink)}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;background:var(--surface2);border-radius:12px}
.twin button{border:0;background:none;padding:10px;border-radius:10px;font-weight:650;color:var(--muted)}
.twin button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sect{margin:22px 0 10px;font:700 13px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:13px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.setrow:first-of-type{border-top:0}
.setrow .sub{display:block;font-size:12px;color:var(--muted)}
.setrow select{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:4px 10px;font-size:16px}
.check{display:flex;align-items:center;gap:10px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}

/* ---- dock ketik cepat ---- */
.dock{flex:none;width:100%;margin:0 auto;max-width:560px;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.dock-row{display:flex;gap:8px;align-items:center}
.dock-row input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.plus{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0;color:var(--accent)}
.save{flex:none;height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
.save:disabled{opacity:.4;cursor:default}
.kb .dock{padding-bottom:10px}
.pv{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.pv:empty{display:none}
.pitem{display:grid;gap:8px;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.pitem.unsure{border-color:var(--warn)}
.prow{display:flex;gap:8px;align-items:center}
.prow input,.prow select{height:40px;min-width:0;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.prow .pname{flex:1}
.prow .pamt{width:118px;text-align:right;font-weight:650}
.prow .pcat{flex:1}
.prow .pdate{flex:none;width:136px}
.prow .ptype{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:700 18px var(--font-num);padding:0}
.prow .ptype.in{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.prow .pdel{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--muted);padding:0;display:grid;place-items:center}
.pmsg{font-size:12px;color:var(--warn-ink);margin:-2px 2px 0}
.pv-head{font-size:12px;color:var(--muted);margin:0 2px -2px}

/* ---- toast & sheet ---- */
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--dockh,64px) + 10px);z-index:40;margin:0 auto;max-width:528px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s ease-out}
.toast span{flex:1;min-width:0}
.toast button{flex:none;border:0;background:none;padding:4px 6px;font-weight:700;color:var(--accent-soft);text-decoration:underline}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet-root{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,18,14,.45);animation:fade .2s ease-out}
.sheet{position:relative;width:min(100%,560px);max-height:94%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h2{margin:0;font:700 20px var(--font-num);letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pitem,.pv{min-width:0}
.prow>*{min-width:0}
.prow input,.prow select{width:auto}
.prow .pname{flex:1 1 0;width:0}
.prow .pamt{flex:none;width:104px}
.prow .pcat{flex:1 1 0;width:0}
.prow .pdate{flex:none;width:132px;padding:0 6px}
.fund{display:grid;gap:2px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.fund .lbl{color:var(--accent)}
.fund .fv{font:700 24px/1.15 var(--font-num);letter-spacing:-.01em;color:var(--accent)}
.minifood>span:first-child{display:block;min-width:0}
.minifood .lbl,.minifood .v{display:block}
button.frow{width:100%;padding:0;border:0;background:none;text-align:left}
.meter{cursor:default}
.meter:active{background:none}
.meter.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s}
.meter.tap:active{background:var(--surface2)}
.chev{font-style:normal;font-weight:700;font-size:18px;line-height:1;color:var(--muted);margin-left:8px;display:inline-block;transform:translateY(1px)}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.bar.mini{display:block;height:5px;margin-top:6px}
.item.itm .a{min-width:96px;text-align:right}
.hero .big.crit{color:var(--crit-ink)}
.rowbtns{display:flex;gap:8px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.stat-note{font-size:12px;color:var(--muted)}
.warnbox{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.prow .pdate{width:118px}.prow .pamt{width:100px}.big{font-size:34px}}
</style>
</head>
<body>
<div id="shell">
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div>
        <h1>Catatan Duit</h1>
        <small id="subtitle">Pantau pengeluaran per periode</small>
      </div>
      <button class="iconbtn" id="btnSettings" type="button" aria-label="Pengaturan">

function foodDaily(key) {
  var fc = catById(S.settings.foodCat);
  var fb = fc ? ebud(fc, key) : 0;
  if (!fc || !fb) return null;
  var r = prange(key), spent = {}, t = todayIso();
  S.tx.forEach(function (x) { if (x.type === 'out' && x.cat === fc.id && x.date >= r.start && x.date <= r.end) spent[x.date] = (spent[x.date] || 0) + x.amount; });
  var base = Math.floor(fb / r.days), pool = fb - base * r.days, cum = 0, rows = [];
  for (var i = 0; i < r.days; i++) {
    var d = addDays(r.start, i), s = spent[d] || 0, debt = pool < 0 ? -pool : 0;
    var allow = Math.max(0, base - debt), deficit = debt > 0, pb = pool;
    // hari depan yang belum ada catatan dianggap terpakai sesuai jatah, supaya sisa defisit mengalir ke hari berikutnya
    pool = (d > t && s === 0) ? pool + base - allow : pool + base - s;
    cum += s;
    rows.push({ date: d, base: base, allow: allow, spent: s, poolBefore: pb, pool: pool, deficit: deficit,
      status: s <= allow ? 'ok' : (pool >= 0 ? 'fund' : 'over'), move: allow >= s ? allow - s : base - s });
  }
  return { cat: fc, rows: rows, total: cum, budget: fb, base: base, range: r };
}

/* ================= parser ketik cepat (tanpa AI) ================= */
var MONIDX = { jan: 0, januari: 0, feb: 1, februari: 1, mar: 2, maret: 2, apr: 3, april: 3, mei: 4, jun: 5, juni: 5, jul: 6, juli: 6, agu: 7, agt: 7, agus: 7, agustus: 7, sep: 8, sept: 8, september: 8, okt: 9, oktober: 9, nov: 10, november: 10, des: 11, desember: 11 };
var WDIDX = { minggu: 0, ahad: 0, senin: 1, selasa: 2, rabu: 3, kamis: 4, jumat: 5, sabtu: 6 };
var INCOME_RE = /\b(gaji|gajian|uang masuk|transfer masuk|dana masuk|terima|diterima|bonus|thr|pemasukan|refund|cashback)\b/;

function extractDate(str, ref) {
  var s = str, m, t = todayIso(), low = s.toLowerCase();
  function res(date, re) { var mm = re.exec(low); return { date: date, rest: (s.slice(0, mm.index) + ' ' + s.slice(mm.index + mm[0].length)), idx: mm.index }; }
  var re;
  re = /\b(\d{4})-(\d{1,2})-(\d{1,2})\b/;
  if ((m = re.exec(low))) { var v = validDate(+m[1], +m[2], +m[3]); if (v) return res(v, re); }
  re = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\d\/])/;
  if ((m = re.exec(low))) {
    var y = m[3] ? (+m[3] < 100 ? 2000 + (+m[3]) : +m[3]) : yearFor(+m[2] - 1, ref);
    var v2 = validDate(y, +m[2], +m[1]); if (v2) return res(v2, re);
  }
  re = /\b(\d{1,2})\s*hari\s*(?:yang\s*)?lalu\b/;
  if ((m = re.exec(low))) return res(addDays(t, -(+m[1])), re);
  re = /\b(?:kemarin\s*lusa|lusa\s*kemarin)\b/;
  if ((m = re.exec(low))) return res(addDays(t, -2), re);
  re = /\b(?:kemarin|kmrn|kemaren)\b/;
  if ((m = re.exec(low))) return res(addDays(t, -1), re);
  re = /\b(?:hari\s*ini|tadi|barusan)\b/;
  if ((m = re.exec(low))) return res(t, re);
  re = /\blusa\b/;
  if ((m = re.exec(low))) return res(addDays(t, 2), re);
  re = /\bbesok\b/;
  if ((m = re.exec(low))) return res(addDays(t, 1), re);
  re = /\b(?:tgl|tanggal)\.?\s*(\d{1,2})\b/;
  if ((m = re.exec(low))) {
    var r = prange(pkeyOf(ref)), n = +m[1];
    for (var i = 0; i < r.days; i++) { var d = addDays(r.start, i); if (pd(d).getDate() === n) return res(d, re); }
    return { date: null, rest: s.replace(new RegExp(m[0], 'i'), ' '), idx: 99 };
  }
  re = /\b(\d{1,2})\s*(jan(?:uari)?|feb(?:ruari)?|mar(?:et)?|apr(?:il)?|mei|jun(?:i)?|jul(?:i)?|agu(?:s(?:tus)?)?|agt|sep(?:t(?:ember)?)?|okt(?:ober)?|nov(?:ember)?|des(?:ember)?)\b(?:\s*(\d{4}))?/;
  if ((m = re.exec(low))) {
    var mi = MONIDX[m[2]];
    var yy = m[3] ? +m[3] : yearFor(mi, ref);
    var v3 = validDate(yy, mi + 1, +m[1]); if (v3) return res(v3, re);
  }
  re = /\b(minggu|ahad|senin|selasa|rabu|kamis|jumat|sabtu)\s*(?:kemarin|lalu|kmrn)\b/;
  if ((m = re.exec(low))) {
    var want = WDIDX[m[1]], k = 1;
    while (pd(addDays(t, -k)).getDay() !== want) k++;
    return res(addDays(t, -k), re);
  }
  return { date: null, rest: s, idx: 99 };
}
function yearFor(mIdx, ref) {
  var r = pd(ref), y = r.getFullYear(), diff = mIdx - r.getMonth();
  if (diff > 6) y--; else if (diff < -6) y++;
  return y;
}

var AMT_RE = /\b(?:rp\.?\s*)?(\d{1,3}(?:\.\d{3})+(?!\d)|\d+(?:[.,]\d+)?)\s*(rb|ribu|k|jt|juta)?(?![a-z0-9])/gi;
function amountValue(numStr, suf) {
  suf = (suf || '').toLowerCase();
  if (!suf && /^\d{1,3}(\.\d{3})+$/.test(numStr)) return parseInt(numStr.replace(/\./g, ''), 10);
  var v = parseFloat(numStr.replace(',', '.'));
  if (suf === 'rb' || suf === 'ribu' || suf === 'k') v *= 1000;
  else if (suf === 'jt' || suf === 'juta') v *= 1e6;
  return Math.round(v);
}
function cleanItem(s) {
  return s.replace(/\b(?:seharga|sebesar|senilai)\b/gi, ' ').replace(/\b(?:rp|idr)\b\.?/gi, ' ')
    .replace(/^[\s+\-–—:.,()@]+|[\s+\-–—:.,()@]+$/g, '').replace(/\s+/g, ' ').trim();
}
// kata kunci pacaran/Bandung: menang atas kata umum (mis. "makan sama pacar" masuk Bandung, bukan Makan)
var STRONG_BDG = { 'bandung': 1, 'bdg': 1, 'pacar': 1, 'pacaran': 1, 'ayang': 1, 'ayangku': 1, 'doi': 1, 'gf': 1, 'girlfriend': 1, 'cewek': 1, 'kencan': 1, 'date': 1, 'dating': 1, 'ngedate': 1, 'dinner date': 1, 'anniv': 1, 'anniversary': 1, 'malam mingguan': 1, 'malming': 1, 'quality time': 1 };
function guessCat(item) {
  var n = norm(item);
  if (S.learn[n] && catById(S.learn[n])) return { cat: S.learn[n], unsure: false };
  var best = null, score = 0;
  S.cats.forEach(function (c) {
    var list = c.kw.concat([norm(c.name)]);
    list.forEach(function (k) {
      if (!k) return;
      var sc = k.length + (c.id === 'bandung' && STRONG_BDG[k] ? 60 : 0);
      if (sc > score && new RegExp('(^|[^a-z0-9])' + escRe(k) + '($|[^a-z0-9])').test(n)) { score = sc; best = c.id; }
    });
  });
  if (best) return { cat: best, unsure: false };
  return { cat: S.settings.fallbackCat, unsure: true };
}

function parseQuick(text, ref) {
  ref = ref || todayIso();
  text = String(text || '').trim();
  if (!text) return [];
  var first = extractDate(text, ref), lead = first.date && first.idx <= 1 ? first.date : null;
  var segs = text.split(/\s*(?:\n|;|,(?!\d))\s*/).filter(function (x) { return x.trim(); });
  var out = [];
  segs.forEach(function (seg) {
    var dd = extractDate(seg, ref), date = dd.date || lead || ref, body = dd.rest;
    var ms = [], m, all = [];
    AMT_RE.lastIndex = 0;
    while ((m = AMT_RE.exec(body))) {
      var val = amountValue(m[1], m[2]);
      all.push({ i: m.index, e: m.index + m[0].length, v: val, ok: !!m[2] || val >= 1000 });
    }
    ms = all.filter(function (x) { return x.ok; });
    var guess = false;
    if (!ms.length && all.length) { ms = [{ i: all[0].i, e: all[0].e, v: all[0].v * 1000 }]; guess = true; }
    if (!ms.length) return;
    var chunks = [];
    if (ms.length === 1) chunks.push({ text: body, m: ms[0] });
    else {
      var amountFirst = /^[\s+\-–—:.,()@]*$/.test(body.slice(0, ms[0].i));
      ms.forEach(function (x, k) {
        if (amountFirst) chunks.push({ text: body.slice(x.i, k + 1 < ms.length ? ms[k + 1].i : body.length), m: { i: 0, e: x.e - x.i, v: x.v } });
        else { var st = k ? ms[k - 1].e : 0; chunks.push({ text: body.slice(st, x.e), m: { i: x.i - st, e: x.e - st, v: x.v } }); }
      });
    }
    chunks.forEach(function (c) {
      var t = c.text, low = t.toLowerCase();
      var isIn = /^\s*\+/.test(t) || INCOME_RE.test(low);
      var item = cleanItem(t.slice(0, c.m.i) + ' ' + t.slice(c.m.e));
      if (!item) item = isIn ? 'Pemasukan' : 'Pengeluaran';
      item = cap(item).slice(0, 80);
      var g = isIn ? { cat: '', unsure: false } : guessCat(item);
      out.push({ item: item, amount: c.m.v, cat: g.cat, date: date, type: isIn ? 'in' : 'out', unsure: g.unsure || guess, guessed: guess });
    });
  });
  return out;
}

  } else foot = '<span>Belum ada budget</span><span></span>';

function listHTML(txs, heads) {

function foodCardHTML(fd, day) {

    '<div class="stat ' + (left < 0 ? 'crit' : 'ok') + '"><span class="lbl">' + (left < 0 ? (row.pool < 0 ? 'Defisit ke besok' : 'Ambil dari dana') : 'Masuk dana') + '</span><b>' + rp(left < 0 && row.pool < 0 ? -row.pool : Math.abs(left)) + '</b></div>' +
    '<div class="stat"><span class="lbl">Jatah besok</span><b>' + (nx ? rp(nx.allow) : '–') + '</b></div></div>' +

function insightsHTML(st, key) {
  var tips = [], today = todayIso(), r = st.r, cur = today >= r.start && today <= r.end;
  var sp = spreadBy(st, key);
  S.cats.forEach(function (c) {
    var cb = ebud(c, key, sp.add);
    if (!cb) return;
    var nt = sp.notes[c.id], mo = nt.out.reduce(function (a, x) { return a + x.amt; }, 0);
    if (mo > 0) { tips.push({ c: 'warn', t: c.name + ' melebihi budget ' + rp(mo) + ', ditutup dari ' + nt.out.map(function (x) { return catById(x.to).name; }).join(' + ') + '.' }); return; }
    var s = sp.eff[c.id], p = s / cb;
    if (p > 1.0001) tips.push({ c: 'crit', t: c.name + ' melebihi budget ' + rp(s - cb) + '.' });
    else if (p >= 0.8) tips.push({ c: 'warn', t: c.name + ' sudah ' + Math.round(p * 100) + '% dari budget, sisa ' + rp(cb - s) + '.' });
  });
  var fd = foodDaily(key);
  if (fd && cur) {
    var row = fd.rows[diffDays(today, r.start)];
    if (row) tips.push({ c: row.status === 'over' ? 'crit' : row.status === 'fund' ? 'warn' : 'info', t: row.status === 'ok' ? 'Jatah makan hari ini ' + rp(row.allow) + ', terpakai ' + rp(row.spent) + '. Dana sisa makan ' + rp(Math.max(0, row.pool)) + '.' : 'Makan hari ini lewat jatah ' + rp(row.spent - row.allow) + (row.status === 'fund' ? ', diambil dari dana sisa (sekarang ' + rp(Math.max(0, row.pool)) + ').' : ', dana sisa habis. Defisit ' + rp(-row.pool) + ' dipotong dari jatah besok.') });
  }
  var tb = etotalBudget(key);
  if (cur && tb > 0) {
    var el = clamp(diffDays(today, r.start) + 1, 1, r.days);
    if (el >= 5) {
      var proj = st.out / el * r.days;
      tips.push(proj > tb ? { c: 'warn', t: 'Dengan laju sekarang, pengeluaran periode ini ± ' + rp(proj) + ' (budget ' + rp(tb) + ').' } : { c: 'info', t: 'Laju pengeluaran masih aman: ± ' + rp(proj) + ' sampai akhir periode.' });
    }
  }
  if (st.out > 0) {
    var top = null; S.cats.forEach(function (c) { if (!top || (st.by[c.id] || 0) > (st.by[top.id] || 0)) top = c; });
    if (top && st.by[top.id] > 0) tips.push({ c: 'info', t: 'Terbesar: ' + top.name + ' (' + Math.round(st.by[top.id] / st.out * 100) + '% dari pengeluaran).' });
  }
  if (cur && !S.tx.some(function (t) { return t.date === today; })) tips.push({ c: 'info', t: 'Belum ada catatan hari ini.' });
  tips = tips.slice(0, 6);
  if (!tips.length) return '';
  return '<section class="card"><h2>Sorotan</h2><ul class="tips">' + tips.map(function (x) { return '<li class="' + x.c + '"><i></i><span>' + esc(x.t) + '</span></li>'; }).join('') + '</ul></section>';
}

function periodHTML() {

/* ================= transaksi: tambah / ubah / hapus ================= */
function addTx(o) {

  S.tx.push(t); return t;
}
function learnItem(item, cat) {
  var n = norm(item); if (!n || n === 'pengeluaran' || n.length > 60 || !catById(cat)) return;
  S.learn[n] = cat;
  var ks = Object.keys(S.learn); if (ks.length > 500) delete S.learn[ks[0]];
}
function removeTx(id) { S.tx = S.tx.filter(function (t) { return t.id !== id; }); S.tomb[id] = Date.now(); }
function restoreTx(t) { t.u = Date.now(); delete S.tomb[t.id]; S.tx.push(t); }

        }).join('') + '</div></div>' : '<div class="field"><span class="fl">Tambah ke budget kategori (opsional)</span><div class="chips"><button type="button" class="chip" data-act="ic" data-id="" aria-pressed="' + (!d.icat) + '">Tidak</button>' + S.cats.map(function (c) {

  function reopen() { catDetailSheet(catId, scope, mod); }

    html: function () {
      var all = mine(), outs = all.filter(function (t) { return t.type === 'out'; }), ins = all.filter(function (t) { return t.type === 'in'; });
      var total = outs.reduce(function (a, t) { return a + t.amount; }, 0), big = null;
      outs.forEach(function (t) { if (!big || t.amount > big.amount) big = t; });
      var h = '<p class="note" style="margin:0 0 10px">' + (scope.day ? esc(scope.label) : 'Periode ' + esc(scope.label)) + '</p>';

      h += '<div class="twin" style="margin:6px 0 14px"><button type="button" data-act="dm" data-v="tgl" aria-pressed="' + (mod === 'tgl') + '">Per tanggal</button><button type="button" data-act="dm" data-v="item" aria-pressed="' + (mod === 'item') + '">Per item</button></div>';
      if (mod === 'tgl') return h + listHTML(all, !scope.day);
      var g = {};

    },

/* ================= navigasi ================= */
function toTop() { var s = $('#scroll'); if (s) s.scrollTop = 0; }
function nav(dir) {
  if (ui.mode === 'periode') ui.pkey = shiftKey(ui.pkey, dir); else ui.day = addDays(ui.day, dir);
  render(); toTop();
}
function setMode(m) {
  if (ui.mode === m) return;
  if (m === 'periode') ui.pkey = pkeyOf(ui.day);
  else { var r = prange(ui.pkey), t = todayIso(); ui.day = t >= r.start && t <= r.end ? t : r.start; }
  ui.mode = m; pv = parseQuick($('#quickText').value, defaultDate()); renderPreview(); render(); toTop();
}
function tick() {
  var t = todayIso();
  if (t === lastToday) return;
  if (ui.day === lastToday) ui.day = t;
  if (ui.pkey === pkeyOf(lastToday)) ui.pkey = pkeyOf(t);
  lastToday = t; render();
}

  $('#dayPick').onchange = function (e) { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { ui.day = e.target.value; render(); } };
  $('#btnSettings').onclick = settingsSheet;
  $('#btnManual').onclick = function () { txSheet(null); };
  $('#quick').onsubmit = function (e) { e.preventDefault(); if (!pv.length) { clearTimeout(qTimer); pv = parseQuick($('#quickText').value, defaultDate()); renderPreview(); } commitQuick(); };
  $('#quickText').addEventListener('input', onQuickInput);

  $('#pv').addEventListener('input', function (e) {
    var el = e.target, row = el.closest('[data-i]'); if (!row) return;
    var p = pv[+row.getAttribute('data-i')], f = el.getAttribute('data-f'); if (!p) return;
    if (f === 'item') p.item = el.value; else if (f === 'amount') p.amount = toNum(el.value); else if (f === 'date') p.date = el.value; else if (f === 'cat') { p.cat = el.value; p.unsure = false; }
    $('#quickSave').disabled = !pv.some(function (x) { return x.amount > 0; });
  });
  $('#pv').addEventListener('change', function (e) {
    var el = e.target; if (el.getAttribute('data-f') === 'amount') { var row = el.closest('[data-i]'); el.value = dot(pv[+row.getAttribute('data-i')].amount); }
  });
  $('#pv').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var row = b.closest('[data-i]'), i = +row.getAttribute('data-i'), p = pv[i];
    if (b.getAttribute('data-act') === 'pt') { p.type = p.type === 'in' ? 'out' : 'in'; if (p.type === 'out') p.cat = p.guessCat || S.settings.fallbackCat; else { p.guessCat = p.cat; p.cat = ''; } renderPreview(); }
    else if (b.getAttribute('data-act') === 'pd') { pv.splice(i, 1); renderPreview(); }
  });

  $('#app').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'edit') txSheet(b.getAttribute('data-id'));
    else if (a === 'catd') {
      var cid = b.getAttribute('data-id');
      if (b.getAttribute('data-day')) catDetailSheet(cid, { a: ui.day, b: ui.day, day: true, key: pkeyOf(ui.day), label: dayLabel(ui.day) });
      else { var pr = prange(ui.pkey); catDetailSheet(cid, { a: pr.start, b: pr.end, key: ui.pkey, label: periodLabel(pr) }); }
    }
    else if (a === 'tofood') { ui.mode = 'harian'; ui.day = todayIso(); render(); toTop(); }
    else if (a === 'cats') catsSheet(null);
    else if (a === 'day') { ui.day = b.getAttribute('data-date'); render(); }
    else if (a === 'w-start') { S.settings.welcomed = true; save(); render(); $('#quickText').focus(); }
    else if (a === 'w-restore') restoreSheet(null);
    else if (a === 'nudge-go') settingsSheet();
    else if (a === 'nudge-x') { ui.nudgeOff = true; render(); }
  });

  var sr = $('#sheetRoot');
  sr.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'sclose') closeSheet(); else if (a === 'sback') { if (SH && SH.back) SH.back(); } else if (SH && SH.click) SH.click(a, b, e);
  });
  sr.addEventListener('focusin', function (e) {
    var t = e.target; if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    setTimeout(function () { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) {} }, 380);
  });
  sr.addEventListener('input', function (e) { if (SH && SH.input) SH.input(e.target); });
  sr.addEventListener('change', function (e) { if (SH && SH.change) SH.change(e.target); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && SH) closeSheet(); else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tap')) { e.preventDefault(); e.target.click(); } });

  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); if (syncOn()) runSync(); } });
  window.addEventListener('online', function () { if (syncOn()) runSync(); });
  setInterval(function () { if (syncOn() && !document.hidden) runSync(); }, 90000);
  window.addEventListener('focus', tick);
  window.addEventListener('pageshow', tick);

  var dock = $('#dock');
  if (window.ResizeObserver) new ResizeObserver(setDockH).observe(dock);
  window.addEventListener('resize', setDockH);
  function fitView() {
    var vv = window.visualViewport, h = vv ? vv.height : window.innerHeight, t = vv ? vv.offsetTop : 0;
    var r = document.documentElement;
    r.style.setProperty('--vvh', Math.round(h) + 'px'); r.style.setProperty('--vvt', Math.round(t) + 'px');
    r.classList.toggle('kb', window.innerHeight - h > 120);
    try { if (window.scrollY) window.scrollTo(0, 0); } catch (e) {}
    setDockH();
  }
  fitView();
  window.addEventListener('resize', fitView); window.addEventListener('orientationchange', fitView);
  document.addEventListener('focusin', function () { setTimeout(fitView, 50); setTimeout(fitView, 350); });
  document.addEventListener('focusout', function () { setTimeout(fitView, 50); setTimeout(fitView, 350); });
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitView); window.visualViewport.addEventListener('scroll', fitView); }
}

function boot() {
  wire(); render(); renderPreview(); setDockH(); if (syncOn()) runSync();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
